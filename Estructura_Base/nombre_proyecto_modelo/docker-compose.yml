services:
  master:
    image: pest-cmdic-linux-ensi
    container_name: master
    entrypoint: ["/bin/bash", "/app/entrypoint_master.sh"]
    environment:
      - MASTER_HOST=master
      - NOMBRE_MODELO_PEST=${NOMBRE_MODELO_PEST:-cmdic_rajos_ensi.pst}
      - NOMBRE_MODELO=${NOMBRE_MODELO:-cmdic_rajos_ensi}
      - EJECUTABLE_MASTER=${EJECUTABLE_MASTER:-./pest_hp}
      - COMANDO_MASTER=${COMANDO_MASTER:-/h}
      - PEST_PORT=${PEST_PORT:-4004}
      - ID_PARAMETRO=1
      - PYTHONUNBUFFERED=1
    networks:
      - mi_red

  autonomo:
    image: pest-cmdic-linux-ensi
    container_name: agente1
    entrypoint: ["/bin/bash", "/app/entrypoint_agent.sh"]
    environment:
      - MASTER_HOST=master
      - NOMBRE_MODELO_PEST=${NOMBRE_MODELO_PEST:-cmdic_rajos_ensi.pst}
      - NOMBRE_MODELO=${NOMBRE_MODELO:-cmdic_rajos_ensi}
      - EJECUTABLE_AGENTE=${EJECUTABLE_AGENTE:-./agent_hp}
      - COMANDO_AGENTE=${COMANDO_AGENTE:-/h}
      - PEST_PORT=${PEST_PORT:-4004}
      - PYTHONUNBUFFERED=1
    networks:
      - mi_red

networks:
  mi_red:
    driver: bridge